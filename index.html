<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https: wss:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'"><title>Mayhem Trade</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>*{box-sizing:border-box}body{margin:0;background:#0b0d10;color:#e9edf2;font:16px system-ui,-apple-system,sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px 40px}header{display:flex;gap:8px;align-items:center;justify-content:space-between}h1{font-size:20px;margin:0}button{border:0;border-radius:12px;padding:14px 10px;font-weight:700;font-size:16px;color:#fff;background:#2b3340}button:disabled{opacity:.4}.small{padding:8px 10px;font-size:14px}.sell{background:#b4232f}.buy{background:#1d7a46}.alt{filter:brightness(.8)}#lock{background:#6b4b00}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.card{background:#151a21;border-radius:16px;padding:14px;margin:12px 0}.row{display:flex;gap:8px;align-items:baseline}.muted,.note{color:#93a0b0;font-size:14px}.mono{font:12px ui-monospace,monospace;color:#93a0b0;word-break:break-all}.warn{background:#4a1d1d;color:#ffb4b4;padding:10px;border-radius:10px;margin:8px 0;font-weight:600}#status{min-height:22px;margin:8px 0;color:#9be3b5}#status.bad{color:#ff8c8c}.sheet{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end}.sheet>div{background:#151a21;width:100%;padding:18px 16px max(18px,env(safe-area-inset-bottom));border-radius:20px 20px 0 0}.sheet[hidden]{display:none}label{display:block;margin:10px 0 4px;color:#93a0b0}input{width:100%;padding:12px;border-radius:10px;border:1px solid #333c48;background:#0b0d10;color:#fff;font-size:16px}input[type=checkbox]{width:auto}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}#go{background:#b4232f;grid-column:span 2;padding:18px}#sol{font-size:22px;font-weight:800;margin-top:10px}</style></head><body>
<header><h1>Mayhem Trade</h1><div><button id="lock" class="small">Lock</button> <button id="openSettings" class="small">⚙︎</button> <button id="connect" class="small">Connect</button></div></header>
<div id="banner"></div><div id="sol">— SOL</div><div id="caps" class="muted"></div><div id="status"></div><div id="rerr" class="warn" style="background:none;padding:0"></div><div id="list"></div><div id="updated" class="muted"></div>
<div id="sheet" class="sheet" hidden><div><div id="sheetBody"></div><div class="actions"><button id="go">CONFIRM — open Phantom</button><button id="sim">Test (unsigned)</button><button id="cancel">Cancel</button></div></div></div>
<div id="settings" class="sheet" hidden><div><h2>Settings</h2><label>RPC URL (Triton, kept on this phone only)</label><input id="rpc" type="password" autocomplete="off" placeholder="https://…"><label>Watch wallet when not connected</label><input id="watch"><label>Slippage %</label><input id="slip" inputmode="decimal"><label>Priority fee SOL</label><input id="pri" inputmode="decimal"><label><input id="dust" type="checkbox"> Hide positions worth under 0.001 SOL</label><label>Type UNLOCK to re-enable trading</label><input id="unlock" autocomplete="off"><div class="actions"><button id="save">Save</button><button id="cancelSettings">Close</button></div></div></div>
<script src="app.js"></script></body></html>
